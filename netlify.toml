[build]
  base = "."
  command = "npm ci --prefix frontend --include=dev && npm --prefix frontend run build:netlify"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "/api"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
